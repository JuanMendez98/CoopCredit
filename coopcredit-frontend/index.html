<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoopCredit - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/main.css">
</head>
<body class="bg-gray-50">
    <div class="min-h-screen flex items-center justify-center px-4">
        <div class="w-full max-w-md">
            <!-- Logo/Header -->
            <div class="text-center mb-8">
                <h1 class="text-4xl font-bold text-gray-900 mb-2">CoopCredit</h1>
                <p class="text-gray-600">Sistema de Crédito Cooperativo</p>
            </div>

            <!-- Login Card -->
            <div class="bg-white rounded-lg shadow-sm border border-gray-100 p-8">
                <!-- Tabs -->
                <div class="flex gap-4 mb-6">
                    <button
                        id="loginTab"
                        class="flex-1 pb-3 text-center border-b-2 border-blue-500 text-gray-900 font-medium"
                        onclick="switchTab('login')">
                        Ingresar
                    </button>
                    <button
                        id="registerTab"
                        class="flex-1 pb-3 text-center border-b-2 border-transparent text-gray-600 font-medium hover:text-gray-900"
                        onclick="switchTab('register')">
                        Registrarse
                    </button>
                </div>

                <!-- Login Form -->
                <form id="loginForm" class="space-y-4" onsubmit="handleLogin(event)">
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">
                            Correo Electrónico
                        </label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                            placeholder="tu@email.com">
                    </div>

                    <div>
                        <label for="loginPassword" class="block text-sm font-medium text-gray-700 mb-1">
                            Contraseña
                        </label>
                        <div class="relative">
                            <input
                                type="password"
                                id="loginPassword"
                                name="password"
                                required
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                placeholder="••••••••">
                            <button
                                type="button"
                                onclick="togglePasswordVisibility('loginPassword')"
                                class="absolute right-3 top-2 text-gray-600 hover:text-gray-900">
                                <svg id="loginEye" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <button
                        type="submit"
                        id="loginBtn"
                        class="w-full bg-blue-500 hover:bg-blue-600 text-white font-medium py-2 rounded-lg transition duration-200">
                        Ingresar
                    </button>
                </form>

                <!-- Register Form -->
                <form id="registerForm" class="space-y-4 hidden" onsubmit="handleRegister(event)">
                    <div>
                        <label for="registerName" class="block text-sm font-medium text-gray-700 mb-1">
                            Nombre Completo
                        </label>
                        <input
                            type="text"
                            id="registerName"
                            name="fullName"
                            required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                            placeholder="Juan Pérez">
                    </div>

                    <div>
                        <label for="registerEmail" class="block text-sm font-medium text-gray-700 mb-1">
                            Correo Electrónico
                        </label>
                        <input
                            type="email"
                            id="registerEmail"
                            name="email"
                            required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                            placeholder="tu@email.com">
                    </div>

                    <div>
                        <label for="registerPassword" class="block text-sm font-medium text-gray-700 mb-1">
                            Contraseña
                        </label>
                        <div class="relative">
                            <input
                                type="password"
                                id="registerPassword"
                                name="password"
                                required
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                placeholder="Mínimo 6 caracteres">
                            <button
                                type="button"
                                onclick="togglePasswordVisibility('registerPassword')"
                                class="absolute right-3 top-2 text-gray-600 hover:text-gray-900">
                                <svg id="registerEye" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="text-xs text-gray-500">
                        Mínimo 6 caracteres. Usa mayúsculas, minúsculas y números para mayor seguridad.
                    </div>

                    <button
                        type="submit"
                        id="registerBtn"
                        class="w-full bg-green-500 hover:bg-green-600 text-white font-medium py-2 rounded-lg transition duration-200">
                        Crear Cuenta
                    </button>
                </form>
            </div>

            <!-- Footer -->
            <p class="text-center text-gray-600 text-sm mt-6">
                © 2025 CoopCredit. Todos los derechos reservados.
            </p>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container"></div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/utils.js"></script>
    <script>
        // Redirigir si ya está autenticado
        if (auth.isTokenValid()) {
            window.location.href = 'pages/dashboard.html';
        }

        function switchTab(tab) {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const loginTab = document.getElementById('loginTab');
            const registerTab = document.getElementById('registerTab');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                loginTab.classList.add('border-blue-500', 'text-gray-900');
                loginTab.classList.remove('border-transparent', 'text-gray-600');
                registerTab.classList.remove('border-blue-500', 'text-gray-900');
                registerTab.classList.add('border-transparent', 'text-gray-600');
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                registerTab.classList.add('border-blue-500', 'text-gray-900');
                registerTab.classList.remove('border-transparent', 'text-gray-600');
                loginTab.classList.remove('border-blue-500', 'text-gray-900');
                loginTab.classList.add('border-transparent', 'text-gray-600');
            }
        }

        async function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('loginPassword').value;
            const btn = document.getElementById('loginBtn');

            if (!isValidEmail(email)) {
                toast.error('Email inválido');
                return;
            }

            if (!isValidPassword(password)) {
                toast.error('Contraseña debe tener mínimo 6 caracteres');
                return;
            }

            try {
                btn.disabled = true;
                btn.textContent = 'Ingresando...';

                await auth.login(email, password);
                toast.success('¡Bienvenido!');

                setTimeout(() => {
                    window.location.href = 'pages/dashboard.html';
                }, 500);
            } catch (error) {
                handleAPIError(error);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Ingresar';
            }
        }

        function togglePasswordVisibility(fieldId) {
            const field = document.getElementById(fieldId);
            const isPassword = field.type === 'password';
            field.type = isPassword ? 'text' : 'password';
        }

        async function handleRegister(event) {
            event.preventDefault();
            const fullName = document.getElementById('registerName').value;
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            const btn = document.getElementById('registerBtn');

            if (!fullName.trim()) {
                toast.error('Nombre completo es requerido');
                return;
            }

            if (!isValidEmail(email)) {
                toast.error('Email inválido');
                return;
            }

            if (!isValidPassword(password)) {
                toast.error('Contraseña debe tener mínimo 6 caracteres');
                return;
            }

            try {
                btn.disabled = true;
                btn.textContent = 'Creando cuenta...';

                await auth.register(email, password, fullName);
                toast.success('¡Cuenta creada exitosamente!');

                setTimeout(() => {
                    window.location.href = 'pages/dashboard.html';
                }, 500);
            } catch (error) {
                handleAPIError(error);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Crear Cuenta';
            }
        }
    </script>
</body>
</html>
