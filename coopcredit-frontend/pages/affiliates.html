<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoopCredit - Afiliados</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/main.css">
</head>
<body class="bg-gray-50">
    <!-- Navbar -->
    <nav class="bg-white border-b border-gray-200 sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center gap-8">
                    <a href="dashboard.html" class="flex items-center gap-3 hover:opacity-75 transition">
                        <div class="w-10 h-10 bg-blue-500 rounded-lg flex items-center justify-center">
                            <span class="text-white font-bold text-lg">C</span>
                        </div>
                        <h1 class="text-xl font-bold text-gray-900">CoopCredit</h1>
                    </a>
                    <span class="text-gray-600">/ Afiliados</span>
                </div>

                <div class="flex items-center gap-4">
                    <button
                        onclick="openCreateModal()"
                        class="px-4 py-2 bg-blue-500 hover:bg-blue-600 text-white font-medium rounded-lg transition">
                        Nuevo Afiliado
                    </button>
                    <button
                        onclick="logout()"
                        class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-lg transition">
                        Salir
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Header -->
        <div class="mb-8">
            <h2 class="text-3xl font-bold text-gray-900">Gestionar Afiliados</h2>
            <p class="text-gray-600 mt-2">Administra la lista de afiliados del sistema</p>
        </div>

        <!-- Tabla de Afiliados -->
        <div class="bg-white rounded-lg border border-gray-200 overflow-hidden">
            <div id="affiliatesTable" class="overflow-x-auto">
                <!-- Se llenará con JavaScript -->
            </div>
        </div>
    </main>

    <!-- Modal: Crear/Editar Afiliado -->
    <div id="affiliateModal" class="modal-overlay">
        <div class="modal w-full max-w-md p-6">
            <div class="flex justify-between items-center mb-6">
                <h3 id="modalTitle" class="text-2xl font-bold text-gray-900">Nuevo Afiliado</h3>
                <button onclick="closeModal()" class="text-gray-500 hover:text-gray-700">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>

            <form id="affiliateForm" class="space-y-4" onsubmit="handleSubmit(event)">
                <input type="hidden" id="affiliateId">

                <div>
                    <label for="document" class="block text-sm font-medium text-gray-700 mb-1">
                        Documento de Identidad *
                    </label>
                    <input
                        type="text"
                        id="document"
                        name="document"
                        required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        placeholder="123456789">
                </div>

                <div>
                    <label for="name" class="block text-sm font-medium text-gray-700 mb-1">
                        Nombre Completo *
                    </label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        placeholder="Juan Pérez">
                </div>

                <div>
                    <label for="salary" class="block text-sm font-medium text-gray-700 mb-1">
                        Salario Mensual (COP) *
                    </label>
                    <input
                        type="number"
                        id="salary"
                        name="salary"
                        required
                        step="0.01"
                        min="0"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        placeholder="5000000">
                </div>

                <div class="flex gap-3 pt-4">
                    <button
                        type="button"
                        onclick="closeModal()"
                        class="flex-1 px-4 py-2 border border-gray-300 text-gray-700 font-medium rounded-lg hover:bg-gray-50 transition">
                        Cancelar
                    </button>
                    <button
                        type="submit"
                        id="submitBtn"
                        class="flex-1 px-4 py-2 bg-blue-500 hover:bg-blue-600 text-white font-medium rounded-lg transition">
                        Guardar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container"></div>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/utils.js"></script>
    <script>
        // Verificar autenticación
        if (!checkAuth()) {
            window.location.href = '../index.html';
        }

        const modal = document.getElementById('affiliateModal');
        setupModalClose('affiliateModal');

        // Logout
        function logout() {
            if (confirm('¿Estás seguro que deseas salir?')) {
                auth.logout();
            }
        }

        // Abrir modal para crear
        function openCreateModal() {
            document.getElementById('affiliateId').value = '';
            document.getElementById('modalTitle').textContent = 'Nuevo Afiliado';
            document.getElementById('affiliateForm').reset();
            showModal('affiliateModal');
        }

        // Cerrar modal
        function closeModal() {
            hideModal('affiliateModal');
        }

        // Abrir modal para editar
        function openEditModal(id, docNumber, name, salary) {
            document.getElementById('affiliateId').value = id;
            document.getElementById('modalTitle').textContent = 'Editar Afiliado';
            document.getElementById('document').value = docNumber;
            document.getElementById('document').disabled = true; // No permitir cambiar el documento
            document.getElementById('name').value = name;
            document.getElementById('salary').value = salary;
            showModal('affiliateModal');
        }

        // Manejar envío del formulario
        async function handleSubmit(event) {
            event.preventDefault();
            const id = document.getElementById('affiliateId').value;
            const docNumber = document.getElementById('document').value.trim();
            const name = document.getElementById('name').value.trim();
            const salary = parseFloat(document.getElementById('salary').value);

            // Validar campos
            if (!docNumber || !name || !salary || salary <= 0) {
                toast.error('Por favor completa todos los campos correctamente');
                return;
            }

            const data = {
                document: docNumber,
                name,
                salary,
                affiliationDate: new Date().toISOString() // Formato ISO 8601
            };

            try {
                const btn = document.getElementById('submitBtn');
                btn.disabled = true;
                btn.textContent = 'Guardando...';

                if (id) {
                    await affiliatesAPI.update(id, data);
                    toast.success('Afiliado actualizado');
                } else {
                    await affiliatesAPI.create(data);
                    toast.success('Afiliado creado');
                }

                closeModal();
                loadAffiliates();
            } catch (error) {
                handleAPIError(error);
            } finally {
                const btn = document.getElementById('submitBtn');
                btn.disabled = false;
                btn.textContent = 'Guardar';
                // Re-habilitar el campo document
                document.getElementById('document').disabled = false;
            }
        }

        // Eliminar afiliado
        async function deleteAffiliate(id, name) {
            if (!confirm(`¿Eliminar a ${name}?`)) return;

            try {
                await affiliatesAPI.delete(id);
                toast.success('Afiliado eliminado');
                loadAffiliates();
            } catch (error) {
                handleAPIError(error);
            }
        }

        // Cargar afiliados
        async function loadAffiliates() {
            try {
                showLoading('affiliatesTable');
                const affiliates = await affiliatesAPI.getAll();

                if (!affiliates || affiliates.length === 0) {
                    showEmptyState('affiliatesTable', 'No hay afiliados registrados');
                    return;
                }

                let html = `
                    <table>
                        <thead>
                            <tr>
                                <th>Documento</th>
                                <th>Nombre</th>
                                <th>Salario</th>
                                <th>Fecha Afiliación</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                affiliates.forEach(affiliate => {
                    const statusBadge = affiliate.status === 'ACTIVE'
                        ? '<span class="px-2 py-1 bg-green-100 text-green-800 text-xs rounded font-medium">Activo</span>'
                        : '<span class="px-2 py-1 bg-red-100 text-red-800 text-xs rounded font-medium">Inactivo</span>';

                    const affiliationDate = affiliate.affiliationDate
                        ? formatDate(affiliate.affiliationDate)
                        : 'N/A';

                    html += `
                        <tr>
                            <td><strong>${affiliate.document}</strong></td>
                            <td>${affiliate.name}</td>
                            <td>${formatCurrency(affiliate.salary)}</td>
                            <td>${affiliationDate}</td>
                            <td>${statusBadge}</td>
                            <td>
                                <button
                                    onclick="openEditModal(${affiliate.id}, '${affiliate.document}', '${affiliate.name.replace(/'/g, "\\'")}', ${affiliate.salary})"
                                    class="text-blue-500 hover:text-blue-700 text-sm font-medium mr-3">
                                    Editar
                                </button>
                                <button
                                    onclick="deleteAffiliate(${affiliate.id}, '${affiliate.name.replace(/'/g, "\\'")}')"
                                    class="text-red-500 hover:text-red-700 text-sm font-medium">
                                    Eliminar
                                </button>
                            </td>
                        </tr>
                    `;
                });

                html += `
                        </tbody>
                    </table>
                `;

                document.getElementById('affiliatesTable').innerHTML = html;
            } catch (error) {
                console.error('Error loading affiliates:', error);
                showEmptyState('affiliatesTable', 'Error al cargar afiliados');
            }
        }

        // Cargar al iniciar
        loadAffiliates();
    </script>
</body>
</html>
