<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoopCredit - Solicitudes de Crédito</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/main.css">
</head>
<body class="bg-gray-50">
    <!-- Navbar -->
    <nav class="bg-white border-b border-gray-200 sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center gap-8">
                    <a href="dashboard.html" class="flex items-center gap-3 hover:opacity-75 transition">
                        <div class="w-10 h-10 bg-blue-500 rounded-lg flex items-center justify-center">
                            <span class="text-white font-bold text-lg">C</span>
                        </div>
                        <h1 class="text-xl font-bold text-gray-900">CoopCredit</h1>
                    </a>
                    <span class="text-gray-600">/ Solicitudes de Crédito</span>
                </div>

                <div class="flex items-center gap-4">
                    <button
                        onclick="openCreateModal()"
                        class="px-4 py-2 bg-green-500 hover:bg-green-600 text-white font-medium rounded-lg transition">
                        Nueva Solicitud
                    </button>
                    <button
                        onclick="logout()"
                        class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-lg transition">
                        Salir
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Header -->
        <div class="mb-8">
            <h2 class="text-3xl font-bold text-gray-900">Solicitudes de Crédito</h2>
            <p class="text-gray-600 mt-2">Gestiona las solicitudes de crédito de los afiliados</p>
        </div>

        <!-- Tabla de Solicitudes -->
        <div class="bg-white rounded-lg border border-gray-200 overflow-hidden">
            <div id="creditsTable" class="overflow-x-auto">
                <!-- Se llenará con JavaScript -->
            </div>
        </div>
    </main>

    <!-- Modal: Crear Solicitud -->
    <div id="creditModal" class="modal-overlay">
        <div class="modal w-full max-w-md p-6">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-2xl font-bold text-gray-900">Nueva Solicitud de Crédito</h3>
                <button onclick="closeModal()" class="text-gray-500 hover:text-gray-700">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>

            <form id="creditForm" class="space-y-4" onsubmit="handleSubmit(event)">
                <div>
                    <label for="affiliateId" class="block text-sm font-medium text-gray-700 mb-1">
                        Afiliado *
                    </label>
                    <select
                        id="affiliateId"
                        name="affiliateId"
                        required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        <option value="">Selecciona un afiliado</option>
                    </select>
                </div>

                <div>
                    <label for="amount" class="block text-sm font-medium text-gray-700 mb-1">
                        Monto (COP) *
                    </label>
                    <input
                        type="number"
                        id="amount"
                        name="amount"
                        required
                        step="0.01"
                        min="0"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        placeholder="5000000">
                </div>

                <div>
                    <label for="term" class="block text-sm font-medium text-gray-700 mb-1">
                        Plazo (meses) *
                    </label>
                    <input
                        type="number"
                        id="term"
                        name="term"
                        required
                        min="1"
                        max="360"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        placeholder="12">
                </div>

                <div>
                    <label for="rate" class="block text-sm font-medium text-gray-700 mb-1">
                        Tasa de Interés (%) *
                    </label>
                    <input
                        type="number"
                        id="rate"
                        name="rate"
                        required
                        step="0.01"
                        min="0"
                        max="100"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        placeholder="5.5">
                </div>

                <div class="flex gap-3 pt-4">
                    <button
                        type="button"
                        onclick="closeModal()"
                        class="flex-1 px-4 py-2 border border-gray-300 text-gray-700 font-medium rounded-lg hover:bg-gray-50 transition">
                        Cancelar
                    </button>
                    <button
                        type="submit"
                        id="submitBtn"
                        class="flex-1 px-4 py-2 bg-green-500 hover:bg-green-600 text-white font-medium rounded-lg transition">
                        Crear
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: Detalles Solicitud -->
    <div id="detailsModal" class="modal-overlay">
        <div class="modal w-full max-w-md p-6">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-2xl font-bold text-gray-900">Detalles Solicitud</h3>
                <button onclick="closeDetailsModal()" class="text-gray-500 hover:text-gray-700">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>

            <div id="detailsContent" class="space-y-4">
                <!-- Se llenará con JavaScript -->
            </div>

            <div class="flex gap-3 pt-4 mt-6 border-t">
                <button
                    type="button"
                    onclick="closeDetailsModal()"
                    class="flex-1 px-4 py-2 border border-gray-300 text-gray-700 font-medium rounded-lg hover:bg-gray-50 transition">
                    Cerrar
                </button>
                <button
                    type="button"
                    id="evaluateBtn"
                    onclick="evaluateCreditRequest()"
                    class="flex-1 px-4 py-2 bg-blue-500 hover:bg-blue-600 text-white font-medium rounded-lg transition">
                    Evaluar
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container"></div>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/utils.js"></script>
    <script>
        // Verificar autenticación
        if (!checkAuth()) {
            window.location.href = '../index.html';
        }

        setupModalClose('creditModal');
        setupModalClose('detailsModal');

        let currentCreditId = null;

        // Logout
        function logout() {
            if (confirm('¿Estás seguro que deseas salir?')) {
                auth.logout();
            }
        }

        // Cargar afiliados en el select
        async function loadAffiliatesSelect() {
            try {
                const affiliates = await affiliatesAPI.getAll();
                const select = document.getElementById('affiliateId');
                select.innerHTML = '<option value="">Selecciona un afiliado</option>';

                affiliates.forEach(affiliate => {
                    const option = document.createElement('option');
                    option.value = affiliate.id;
                    option.textContent = affiliate.name;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error('Error loading affiliates:', error);
            }
        }

        // Abrir modal para crear
        function openCreateModal() {
            document.getElementById('creditForm').reset();
            loadAffiliatesSelect();
            showModal('creditModal');
        }

        // Cerrar modal
        function closeModal() {
            hideModal('creditModal');
        }

        function closeDetailsModal() {
            hideModal('detailsModal');
        }

        // Manejar envío del formulario
        async function handleSubmit(event) {
            event.preventDefault();
            const affiliateId = parseInt(document.getElementById('affiliateId').value);
            const amount = parseFloat(document.getElementById('amount').value);
            const term = parseInt(document.getElementById('term').value);
            const rate = parseFloat(document.getElementById('rate').value);

            // Validar campos
            if (!affiliateId || !amount || amount <= 0 || !term || term <= 0 || !rate || rate < 0) {
                toast.error('Por favor completa todos los campos correctamente');
                return;
            }

            const data = {
                affiliateId,
                amount,
                term,
                rate
            };

            try {
                const btn = document.getElementById('submitBtn');
                btn.disabled = true;
                btn.textContent = 'Creando...';

                await creditRequestsAPI.create(data);
                toast.success('Solicitud creada exitosamente');

                closeModal();
                loadCredits();
            } catch (error) {
                handleAPIError(error);
            } finally {
                const btn = document.getElementById('submitBtn');
                btn.disabled = false;
                btn.textContent = 'Crear';
            }
        }

        // Ver detalles
        async function viewDetails(id) {
            try {
                currentCreditId = id;
                const credit = await creditRequestsAPI.getById(id);

                let statusBadge = '';
                if (credit.status === 'PENDING') {
                    statusBadge = '<span class="px-2 py-1 bg-yellow-100 text-yellow-800 text-xs rounded font-medium">Pendiente</span>';
                } else if (credit.status === 'APPROVED') {
                    statusBadge = '<span class="px-2 py-1 bg-green-100 text-green-800 text-xs rounded font-medium">Aprobada</span>';
                } else if (credit.status === 'REJECTED') {
                    statusBadge = '<span class="px-2 py-1 bg-red-100 text-red-800 text-xs rounded font-medium">Rechazada</span>';
                }

                // Información de evaluación de riesgo
                let riskInfo = 'Pendiente de evaluación';
                if (credit.riskEvaluation) {
                    const risk = credit.riskEvaluation;
                    const scoreClass = risk.score >= 700 ? 'text-green-600' : (risk.score >= 500 ? 'text-yellow-600' : 'text-red-600');
                    riskInfo = `
                        <div class="mt-2 p-3 bg-gray-50 rounded-lg">
                            <p class="text-sm font-medium">Score: <span class="${scoreClass}">${risk.score || 'N/A'}</span></p>
                            <p class="text-sm">Nivel: ${risk.level || 'N/A'}</p>
                            <p class="text-sm text-gray-600">${risk.message || ''}</p>
                        </div>
                    `;
                }

                const html = `
                    <div>
                        <p class="text-gray-600 text-sm">Estado</p>
                        <p class="mt-1">${statusBadge}</p>
                    </div>
                    <div>
                        <p class="text-gray-600 text-sm">Afiliado</p>
                        <p class="text-lg font-semibold">${credit.affiliateName || 'N/A'}</p>
                    </div>
                    <div>
                        <p class="text-gray-600 text-sm">Monto Solicitado</p>
                        <p class="text-lg font-semibold">${formatCurrency(credit.amount)}</p>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <p class="text-gray-600 text-sm">Plazo</p>
                            <p class="text-lg font-semibold">${credit.term} meses</p>
                        </div>
                        <div>
                            <p class="text-gray-600 text-sm">Tasa de Interés</p>
                            <p class="text-lg font-semibold">${credit.rate}%</p>
                        </div>
                    </div>
                    <div>
                        <p class="text-gray-600 text-sm">Evaluación de Riesgo</p>
                        ${riskInfo}
                    </div>
                    <div>
                        <p class="text-gray-600 text-sm">Fecha de Solicitud</p>
                        <p class="text-lg font-semibold">${credit.createdAt ? formatDateTime(credit.createdAt) : 'N/A'}</p>
                    </div>
                `;

                document.getElementById('detailsContent').innerHTML = html;

                // Mostrar/ocultar botón de evaluación
                const evaluateBtn = document.getElementById('evaluateBtn');
                if (credit.status === 'PENDING') {
                    evaluateBtn.style.display = 'block';
                } else {
                    evaluateBtn.style.display = 'none';
                }

                showModal('detailsModal');
            } catch (error) {
                handleAPIError(error);
            }
        }

        // Evaluar solicitud
        async function evaluateCreditRequest() {
            if (!currentCreditId) return;

            try {
                const btn = document.getElementById('evaluateBtn');
                btn.disabled = true;
                btn.textContent = 'Evaluando...';

                await creditRequestsAPI.evaluate(currentCreditId);
                toast.success('Solicitud evaluada');

                closeDetailsModal();
                loadCredits();
            } catch (error) {
                handleAPIError(error);
            } finally {
                document.getElementById('evaluateBtn').disabled = false;
                document.getElementById('evaluateBtn').textContent = 'Evaluar';
            }
        }

        // Cargar solicitudes
        async function loadCredits() {
            try {
                showLoading('creditsTable');
                const credits = await creditRequestsAPI.getAll();

                if (!credits || credits.length === 0) {
                    showEmptyState('creditsTable', 'No hay solicitudes registradas');
                    return;
                }

                // Cargar información de afiliados si no viene en la respuesta
                let affiliatesMap = {};
                try {
                    const affiliates = await affiliatesAPI.getAll();
                    affiliates.forEach(aff => {
                        affiliatesMap[aff.id] = aff.name;
                    });
                } catch (err) {
                    console.error('Error loading affiliates:', err);
                }

                let html = `
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Afiliado</th>
                                <th>Monto</th>
                                <th>Plazo</th>
                                <th>Tasa</th>
                                <th>Estado</th>
                                <th>Fecha</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                credits.forEach(credit => {
                    let statusBadge = '';
                    if (credit.status === 'PENDING') {
                        statusBadge = '<span class="px-2 py-1 bg-yellow-100 text-yellow-800 text-xs rounded font-medium">Pendiente</span>';
                    } else if (credit.status === 'APPROVED') {
                        statusBadge = '<span class="px-2 py-1 bg-green-100 text-green-800 text-xs rounded font-medium">Aprobada</span>';
                    } else if (credit.status === 'REJECTED') {
                        statusBadge = '<span class="px-2 py-1 bg-red-100 text-red-800 text-xs rounded font-medium">Rechazada</span>';
                    }

                    // Obtener nombre del afiliado
                    const affiliateName = credit.affiliateName || affiliatesMap[credit.affiliateId] || `ID: ${credit.affiliateId}`;
                    const createdDate = credit.createdAt ? formatDate(credit.createdAt) : 'N/A';

                    html += `
                        <tr>
                            <td><strong>#${credit.id}</strong></td>
                            <td>${affiliateName}</td>
                            <td>${formatCurrency(credit.amount)}</td>
                            <td>${credit.term} meses</td>
                            <td>${credit.rate}%</td>
                            <td>${statusBadge}</td>
                            <td class="text-sm">${createdDate}</td>
                            <td>
                                <button
                                    onclick="viewDetails(${credit.id})"
                                    class="text-blue-500 hover:text-blue-700 text-sm font-medium">
                                    Ver detalles
                                </button>
                            </td>
                        </tr>
                    `;
                });

                html += `
                        </tbody>
                    </table>
                `;

                document.getElementById('creditsTable').innerHTML = html;
            } catch (error) {
                console.error('Error loading credits:', error);
                showEmptyState('creditsTable', 'Error al cargar solicitudes');
            }
        }

        // Cargar al iniciar
        loadCredits();
    </script>
</body>
</html>
