version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: coopcredit-postgres
    environment:
      POSTGRES_DB: coopcredit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - coopcredit-network

  # Risk Central Mock Service
  risk-central-service:
    build:
      context: ./risk-central-mock-service
      dockerfile: Dockerfile
    container_name: risk-central-service
    ports:
      - "8081:8081"
    environment:
      SPRING_APPLICATION_NAME: risk-central-mock-service
      SERVER_PORT: 8081
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/risk/risk-evaluation"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - coopcredit-network
    restart: unless-stopped

  # Credit Application Service
  credit-application-service:
    build:
      context: ./credit-application-service
      dockerfile: Dockerfile
    container_name: credit-application-service
    ports:
      - "8080:8080"
    environment:
      SPRING_APPLICATION_NAME: credit-application-service
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/coopcredit
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_SHOW_SQL: "false"
      RISK_SERVICE_URL: http://risk-central-service:8081/api/risk/risk-evaluation
    depends_on:
      postgres:
        condition: service_healthy
      risk-central-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/auth/login"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - coopcredit-network
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: ./coopcredit-frontend
      dockerfile: Dockerfile
    container_name: coopcredit-frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:8080/api
      REACT_APP_RISK_API_URL: http://localhost:8081/api
    depends_on:
      - credit-application-service
    networks:
      - coopcredit-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  coopcredit-network:
    driver: bridge
