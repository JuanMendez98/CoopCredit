spring:
  application:
    name: credit-application-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5444}/${DB_NAME:coopcredit_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

risk:
  service:
    url: ${RISK_SERVICE_URL:http://localhost:8081/api/risk/risk-evaluation}

jwt:
  secret: ${JWT_SECRET:mySecretKeyThatIsAtLeast256BitsLongForHS256AlgorithmUseInProductionEnv123456}
  expiration: ${JWT_EXPIRATION:86400000}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    urls-primary-name: API
    enabled: true
    doc-expansion: list
    filter: true
    show-extensions: true
    url: /v3/api-docs
  show-actuator: true
  use-fqn: true
  cache:
    disabled: false
    ttl: 3600s
  open-api:
    title: CoopCredit API
    description: Credit Application and Risk Assessment System
    version: "1.0.0"
    contact:
      name: CoopCredit Support
      email: support@coopcredit.com
      url: https://coopcredit.com
    license:
      name: Apache 2.0
      url: https://www.apache.org/licenses/LICENSE-2.0.html
    terms-of-service: https://coopcredit.com/terms

logging:
  level:
    com.crudzao.creditapp: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
